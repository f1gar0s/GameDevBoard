<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GameDev Board</title>
  <meta name="description" content="Онлайн-доска в стиле Miro для разработчиков игр: GDD, диалоги с плейтестом, редактор уровней, кривые баланса, лут-таблицы, канбан спринта и совместная работа.">
  <meta name="theme-color" content="#0d0f15">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M9 12h4v-3h6v3h4v4h-3v3h-2v-3h-4v3h-2v-3H9z' fill='%23fff'/%3E%3Crect x='11' y='21' width='3' height='3' fill='%2322d3a6'/%3E%3Crect x='18' y='21' width='3' height='3' fill='%2322d3a6'/%3E%3C/svg%3E">
  <!-- Шрифты: на своём сервере лежат локально (fonts/), иначе берутся с Google Fonts.
       Подключаются без блокировки: если Google недоступен, страница всё равно открывается сразу. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Главная -->
  <main id="home" class="screen"></main>

  <!-- Редактор -->
  <div id="editor" class="screen hidden">
    <header class="topbar">
      <a class="logo-btn" href="#/" title="Все доски"><span class="logo-mark"></span></a>
      <input id="board-name" class="board-name" spellcheck="false" maxlength="80">
      <span id="save-state" class="save-state"></span>
      <div class="grow"></div>
      <div id="presence" class="presence"></div>
      <button id="btn-collab" class="btn" title="Совместная работа в реальном времени">👥 <span class="hide-sm">Совместно</span></button>
      <button id="btn-share" class="btn" title="Ссылка-снимок доски">🔗 <span class="hide-sm">Поделиться</span></button>
      <div class="menu-wrap">
        <button id="btn-export" class="btn" title="Экспорт">⤓ <span class="hide-sm">Экспорт</span></button>
        <div id="export-menu" class="menu hidden">
          <button data-act="gdd">📘 GDD в Markdown <small>документ из фреймов и карточек</small></button>
          <button data-act="dialogs">💬 Диалоги для игры (JSON) <small>один файл — один диалог, условия и действия</small></button>
          <button data-act="texts">🌐 Собрать все тексты (CSV) <small>русский текст — ключ, колонка для перевода</small></button>
          <button data-act="engine">🎮 Данные для движка (JSON) <small>Unity / Godot / Unreal</small></button>
          <button data-act="file">💾 Файл доски (.gdboard.json) <small>полная копия с картинками</small></button>
          <button data-act="import">📂 Импорт файла доски</button>
        </div>
      </div>
      <button id="btn-overview" class="btn primary" title="Прогресс, сущности, поиск, проверки">📊 <span class="hide-sm">Обзор</span></button>
    </header>

    <div id="viewport">
      <div id="world">
        <svg id="links" class="layer-svg"></svg>
        <div id="items"></div>
        <svg id="temp" class="layer-svg temp"></svg>
        <div id="selbox"></div>
        <div id="cursors"></div>
      </div>
      <div id="marquee"></div>
      <div id="ctxbar" style="display:none"></div>
      <div id="empty-hint" class="empty-hint hidden">
        <div class="eh-title">Пустая доска</div>
        <div><b>N</b> стикер · <b>R</b> фигура · <b>F</b> фрейм · <b>C</b> связь</div>
        <div>Откройте <b>＋ Инстр.</b> слева: карточки с компонентами, реплики, баги, задачи, карты, холст</div>
      </div>
    </div>

    <nav id="toolbar" class="toolbar"></nav>
    <div id="penbar" class="penbar hidden"></div>
    <aside id="library" class="drawer left hidden"></aside>
    <aside id="overview" class="drawer right hidden"></aside>

    <div class="zoombar">
      <button id="z-out" title="Отдалить (Ctrl −)">−</button>
      <button id="z-val" title="100% (Ctrl 0)">100%</button>
      <button id="z-in" title="Приблизить (Ctrl +)">+</button>
      <button id="z-fit" title="Показать всё (Shift 1)">⤢</button>
      <button id="z-help" title="Горячие клавиши">?</button>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
